<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Professional WFM Dashboard</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<header>
    <h1>WFM Performance Dashboard</h1>
    <p>Workforce Management Analytics</p>
</header>

<div class="container">

    <section class="upload-section">
        <h2>Upload Excel Raw Data</h2>

        <input type="file" id="excelFile" accept=".xlsx,.xls,.csv">

        <p id="uploadStatus">
            Please upload your WFM Excel file.
        </p>
    </section>

    <section class="cards">

        <div class="card">
            <h3>Total Records</h3>
            <h2 id="totalRecords">--</h2>
        </div>

        <div class="card">
            <h3>Total Columns</h3>
            <h2 id="totalColumns">--</h2>
        </div>

        <div class="card">
            <h3>Total Sheets</h3>
            <h2 id="totalSheets">--</h2>
        </div>

        <div class="card">
            <h3>Attendance</h3>
            <h2 id="attendance">--</h2>
        </div>

        <div class="card">
            <h3>Adherence</h3>
            <h2 id="adherence">--</h2>
        </div>

    </section>

    <section class="panel">
        <h2>Excel Data Preview</h2>

        <div class="table-container">
            <table id="dataTable">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

    <section class="panel">
        <h2>WFM Performance Chart</h2>
        <canvas id="wfmChart"></canvas>
    </section>

</div>

<footer>
    WFM Dashboard | Powered by GitHub Pages
</footer>

<script src="app.js"></script>

</body>
</html>
