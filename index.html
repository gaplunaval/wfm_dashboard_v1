<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WFM Analytics Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px;
        }

        .header {
            background: #14213d;
            color: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
        }

        .upload-box {
            background: white;
            padding: 35px;
            margin-top: 30px;
            border-radius: 10px;
            text-align: center;
        }

        input {
            padding: 15px;
            margin-top: 20px;
        }

        h2 {
            color: #14213d;
        }
    </style>

</head>

<body>

    <div class="header">

        <h1>WFM ANALYTICS DASHBOARD</h1>

        <p>Workforce Management Reporting System</p>

    </div>

    <div class="upload-box">

        <h2>Upload WFM Raw Data</h2>

        <p>Select your Excel Raw Data File</p>

        <input
            type="file"
            id="excelFile"
            accept=".xlsb,.xlsx,.xls"
        >

        <p id="status">Waiting for Excel File...</p>

    </div>

</body>

</html>
